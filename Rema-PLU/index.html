
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REMA 1000 PLU</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f4;
            color: #202820;
        }

        header {
            background: #075e36;
            color: white;
            padding: 24px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }
        A
        header p {
            margin-bottom: 0;
            color: #e0f0e9;
        }

        main {
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 20px #0000000d;
        }

        .card h2 {
            margin-top: 0;
        }

        .start-button {
            display: inline-block;
            background: #075e36;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .start-button:hover {
            background: #064729;
            transform: translateY(-2px);
        }

        .welcome-icon {
            font-size: 56px;
            margin: 10px 0 20px;
        }

        .description {
            color: #59645c;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        footer {
            text-align: center;
            color: #69736b;
            font-size: 13px;
            padding: 0 20px 25px;
        }

        @media (max-width: 480px) {
            main {
                margin: 30px auto;
            }

            .card {
                padding: 24px 18px;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>REMA 1000 PLU</h1>
        <p>Træn dine PLU-numre</p>
    </header>

    <main>
        <div class="card">
            <div class="welcome-icon" aria-hidden="true">🛒</div>

            <h2>Velkommen!</h2>

            <p class="description">
                Test din viden om PLU-numre, øv dig på butikkens
                produkter, og bliv mere sikker ved kassen.
            </p>

            <a class="start-button" href="modes.html">
                Start træning →
            </a>
        </div>
    </main>

    <footer>
        Et træningsværktøj til PLU-numre
    </footer>
</body>
</html>
