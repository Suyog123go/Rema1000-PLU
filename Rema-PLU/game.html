
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spil | REMA 1000 PLU</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f4;
            color: #202820;
        }

        header {
            background: #075e36;
            color: white;
            padding: 22px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin-bottom: 0;
            color: #e0f0e5;
        }

        main {
            max-width: 520px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat {
            background: white;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            flex: 1;
            box-shadow: 0 3px 14px #0000000a;
        }

        .stat strong {
            display: block;
            font-size: 21px;
            margin-bottom: 4px;
        }

        .stat span {
            color: #59645c;
            font-size: 13px;
        }

        .game-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 3px 14px #0000000a;
        }

        #product-image {
            display: none;
            width: 100%;
            max-height: 260px;
            object-fit: contain;
            margin: 0 auto 18px;
            border-radius: 8px;
        }

        #product-name {
            font-size: 25px;
            margin: 12px 0 22px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            font-size: 18px;
            border: 2px solid #d5ddd7;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        input:focus {
            outline: 2px solid #075e36;
            border-color: #075e36;
        }

        button {
            padding: 13px 16px;
            border: none;
            border-radius: 8px;
            background: #075e36;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #064729;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .main-button {
            width: 100%;
        }

        .secondary-button {
            background: #e8eee9;
            color: #202820;
        }

        .secondary-button:hover {
            background: #dce5de;
        }

        #feedback {
            margin: 16px 0;
            line-height: 1.5;
            font-weight: bold;
        }

        .game-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .game-actions button {
            flex: 1;
        }

        #message {
            background: white;
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
        }

        .back-link {
            display: inline-block;
            margin: 20px 0;
            color: #075e36;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <header>
        <h1>REMA 1000 PLU</h1>
        <p id="mode-name">Træning</p>
    </header>

    <main>
        <div id="message" hidden></div>

        <section id="game">
            <div class="stats">
                <div class="stat">
                    <strong id="progress">0/0</strong>
                    <span>Spørgsmål</span>
                </div>

                <div class="stat">
                    <strong id="score">0</strong>
                    <span>Korrekte svar</span>
                </div>
            </div>

            <div class="game-card">
                <img id="product-image" alt="Produkt">

                <p>Hvad er PLU-nummeret for:</p>
                <h2 id="product-name">Indlæser...</h2>

                <form id="answer-form">
                    <label for="answer">Skriv PLU-nummer</label>

                    <input
                        id="answer"
                        type="text"
                        inputmode="numeric"
                        autocomplete="off"
                        placeholder="Fx 2023"
                        required
                    >

                    <button class="main-button" id="submit-button" type="submit">
                        Tjek svar
                    </button>
                </form>

                <p id="feedback" role="status" aria-live="polite"></p>

                <button
                    id="next-button"
                    class="main-button"
                    type="button"
                    hidden
                >
                    Næste produkt →
                </button>

                <div class="game-actions">
                    <button id="skip-button" class="secondary-button" type="button">
                        Spring over
                    </button>

                    <button id="restart-button" class="secondary-button" type="button">
                        Start forfra
                    </button>
                </div>
            </div>
        </section>

        <a class="back-link" href="modes.html">← Tilbage til kategorier</a>
    </main>

    <!-- Load the product database first -->
    <script src="products.js"></script>

    <script>
        const category = sessionStorage.getItem("pluCategory") || "bageri";
        const difficulty = sessionStorage.getItem("pluDifficulty") || "all";

        const categoryNames = {
            general: "Generel",
            bageri: "Bageri",
            grontsager: "Grøntsager",
            frugt: "Frugt",
            okologi: "Økologi",
            other: "Andet",
            halloween: "Halloween"
        };

        const difficultyValues = {
            easy: 1,
            medium: 2,
            hard: 3
        };

        const modeName = document.getElementById("mode-name");
        const game = document.getElementById("game");
        const message = document.getElementById("message");
        const productImage = document.getElementById("product-image");
        const productName = document.getElementById("product-name");
        const answerForm = document.getElementById("answer-form");
        const answerInput = document.getElementById("answer");
        const submitButton = document.getElementById("submit-button");
        const nextButton = document.getElementById("next-button");
        const skipButton = document.getElementById("skip-button");
        const restartButton = document.getElementById("restart-button");
        const feedback = document.getElementById("feedback");

        let round = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        modeName.textContent = categoryNames[category] || "Træning";

        function getProducts() {
            if (typeof products === "undefined" || !Array.isArray(products)) {
                throw new Error("products.js blev ikke indlæst korrekt.");
            }

            return products.filter(function (product) {
                if (product.active !== true) {
                    return false;
                }

                if (category === "general") {
                    return product.generalDifficulty === difficultyValues[difficulty];
                }

                return Array.isArray(product.categories) &&
                    product.categories.includes(category);
            });
        }

        function shuffle(items) {
            const shuffled = [...items];

            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            return shuffled;
        }

        function startGame() {
            try {
                round = shuffle(getProducts());
            } catch (error) {
                showMessage(error.message);
                return;
            }

            if (round.length === 0) {
                showMessage(
                    "Der er ingen aktive produkter i denne kategori endnu. " +
                    "Tjek at produkterne har active: true, og at kategorien er korrekt."
                );
                return;
            }

            currentIndex = 0;
            score = 0;

            message.hidden = true;
            game.hidden = false;

            showProduct();
        }

        function showMessage(text) {
            game.hidden = true;
            message.hidden = false;
            message.textContent = text;
        }

        function showProduct() {
            answered = false;

            const product = round[currentIndex];

            productName.textContent = product.name;
            answerInput.value = "";
            answerInput.disabled = false;
            submitButton.disabled = false;
            submitButton.hidden = false;
            nextButton.hidden = true;
            skipButton.disabled = false;
            feedback.textContent = "";

            if (product.image) {
                productImage.src = product.image;
                productImage.alt = product.name;

                productImage.onload = function () {
                    productImage.style.display = "block";
                };

                productImage.onerror = function () {
                    productImage.style.display = "none";
                };

                productImage.style.display = "block";
            } else {
                productImage.removeAttribute("src");
                productImage.style.display = "none";
            }

            document.getElementById("progress").textContent =
                (currentIndex + 1) + "/" + round.length;

            document.getElementById("score").textContent = score;

            answerInput.focus();
        }

        answerForm.addEventListener("submit", function (event) {
            event.preventDefault();

            if (answered) return;

            const answer = answerInput.value.trim();

            if (!answer) {
                feedback.textContent = "Skriv et PLU-nummer først.";
                return;
            }

            answered = true;

            const product = round[currentIndex];

            answerInput.disabled = true;
            submitButton.disabled = true;
            submitButton.hidden = true;
            skipButton.disabled = true;
            nextButton.hidden = false;

            if (answer === String(product.plu)) {
                score++;
                feedback.textContent = "✅ Korrekt! PLU: " + product.plu;
                feedback.style.color = "#08763d";
            } else {
                feedback.textContent =
                    "❌ Ikke helt. Det rigtige PLU er " + product.plu + ".";
                feedback.style.color = "#b42318";
            }

            document.getElementById("score").textContent = score;
            nextButton.textContent =
                currentIndex === round.length - 1
                    ? "Se resultat →"
                    : "Næste produkt →";
        });

        function nextProduct() {
            if (!answered) return;

            currentIndex++;

            if (currentIndex >= round.length) {
                showResults();
            } else {
                showProduct();
            }
        }

        function showResults() {
            game.hidden = true;
            message.hidden = false;

            const percentage = Math.round((score / round.length) * 100);

            message.textContent =
                "🎉 Runde færdig! Du fik " + score + " ud af " +
                round.length + " rigtige (" + percentage + "%).";

            const playAgain = document.createElement("button");
            playAgain.textContent = "Spil igen";
            playAgain.style.marginTop = "12px";
            playAgain.addEventListener("click", startGame);

            message.appendChild(document.createElement("br"));
            message.appendChild(playAgain);
        }

        function skipProduct() {
            if (answered) return;

            answered = true;

            const product = round[currentIndex];

            answerInput.disabled = true;
            submitButton.disabled = true;
            submitButton.hidden = true;
            skipButton.disabled = true;
            nextButton.hidden = false;

            feedback.textContent = "Sprunget over. PLU: " + product.plu;
            feedback.style.color = "#59645c";

            nextButton.textContent =
                currentIndex === round.length - 1
                    ? "Se resultat →"
                    : "Næste produkt →";
        }

        nextButton.addEventListener("click", nextProduct);
        skipButton.addEventListener("click", skipProduct);
        restartButton.addEventListener("click", startGame);

        startGame();
    </script>
</body>
</html>
